<svg width="1600" height="200" viewBox="0 0 1600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="1" fill="rgba(255, 255, 255, 0.15)"/>
    </pattern>
    <filter id="crt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="200" fill="#000000"/>
  <rect width="1600" height="200" fill="url(#grid)"/>

  <path d="M 40 20 L 1560 20 L 1560 180 L 40 180 Z" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <path d="M 36 20 L 44 20 M 1556 20 L 1564 20 M 36 180 L 44 180 M 1556 180 L 1564 180 M 40 16 L 40 24 M 1560 16 L 1560 24 M 40 176 L 40 184 M 1560 176 L 1560 184" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1"/>

  <g>
    <path d="M -900 130 Q -700 50 -500 130 T -100 130 T 300 130 T 700 130 T 1100 130 T 1500 130 T 1900 130 T 2300 130 T 2500 130" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-800,0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M -900 130 Q -800 80 -700 130 T -500 130 T -300 130 T -100 130 T 100 130 T 300 130 T 500 130 T 700 130 T 900 130 T 1100 130 T 1300 130 T 1500 130 T 1700 130 T 1900 130 T 2100 130 T 2300 130 T 2500 130" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="6,6">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-400,0" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path d="M -900 130 Q -850 105 -800 130 T -700 130 T -600 130 T -500 130 T -400 130 T -300 130 T -200 130 T -100 130 T 0 130 T 100 130 T 200 130 T 300 130 T 400 130 T 500 130 T 600 130 T 700 130 T 800 130 T 900 130 T 1000 130 T 1100 130 T 1200 130 T 1300 130 T 1400 130 T 1500 130 T 1600 130 T 1700 130 T 1800 130 T 1900 130 T 2000 130 T 2100 130 T 2200 130 T 2300 130 T 2400 130 T 2500 130" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8" stroke-dasharray="2,2">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-200,0" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(0, 0)">
    <text x="800" y="88" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle" filter="url(#crt-glow)">BUILDING THE FUTURE — ONE COMMIT AT A TIME</text>
    <text x="800" y="136" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" fill="rgba(255, 255, 255, 0.6)" letter-spacing="6" text-anchor="middle" filter="url(#crt-glow)">github.com/Anubisx404</text>
  </g>

  <g font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="10" fill="rgba(255, 255, 255, 0.25)">
    <text x="60" y="48">[SYSTEM_SECURE: TRUE]</text>
    <text x="60" y="156">y(t) = ∑ A_n sin(n·ω·t)</text>

    <text x="1540" y="48" text-anchor="end">[SESSION_INIT: COMPLETE]</text>
    <text x="1540" y="156" text-anchor="end">F(k) = ∫ f(x) e^(-2πixk) dx</text>
  </g>
</svg>