    <text x="60" y="90">[SYS_STATUS: ACTIVE]</text>
    <text x="60" y="445">ψ(x,t) = A·e^(i(kx-ωt))</text>
    <text x="60" y="465">E² = (p·c)² + (m₀·c²)²</text>

    <text x="1540" y="70" text-anchor="end">[MODEL: HERMES-A]</text>
    <text x="1540" y="90" text-anchor="end">[LOC: GR-38.60]</text>
    <text x="1540" y="445" text-anchor="end">G_μν + Λg_μν = 8πG/c⁴ T_μν</text>
