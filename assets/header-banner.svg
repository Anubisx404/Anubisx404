    <text x="800" y="278" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="110" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle" filter="url(#crt-glow)">MOHAMED ALAA</text>
    
    <text x="800" y="358" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" fill="rgba(255, 255, 255, 0.5)" letter-spacing="4" text-anchor="middle">PHYSICS  ·  COMPUTER SCIENCE  ·  CYBERSECURITY</text>
