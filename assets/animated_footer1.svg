<svg width="1600" height="280" viewBox="0 0 1600 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="280">
      <stop offset="0%" stop-color="#020202"></stop>
      <stop offset="50%" stop-color="#070808"></stop>
      <stop offset="100%" stop-color="#000000"></stop>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7CFF9A" stop-opacity="0.6"></stop>
      <stop offset="100%" stop-color="#7CFF9A" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Stroke -->
    <linearGradient id="stroke" x1="0" y1="0" x2="1600" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"></stop>
      <stop offset="50%" stop-color="#7CFF9A" stop-opacity="1"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"></stop>
    </linearGradient>

    <!-- Blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="12"></feGaussianBlur>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="280" fill="url(#bg)"></rect>

  <!-- Moving glow core -->
  <ellipse cx="800" cy="140" rx="300" ry="90" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="rx" values="260;340;260" dur="6s" repeatCount="indefinite"></animate>
    <animate attributeName="ry" values="70;110;70" dur="6s" repeatCount="indefinite"></animate>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"></animate>
  </ellipse>

  <!-- Flowing wave 1 -->
  <path stroke="url(#stroke)" stroke-width="2" fill="none">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
        M0 160 C300 100 500 220 800 160 C1100 100 1300 220 1600 160;
        M0 150 C300 200 500 80 800 150 C1100 220 1300 100 1600 150;
        M0 160 C300 100 500 220 800 160 C1100 100 1300 220 1600 160
      "></animate>
  </path>

  <!-- Flowing wave 2 -->
  <path stroke="#7CFF9A" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="
        M0 180 C400 120 600 240 900 180 C1200 120 1400 240 1600 180;
        M0 170 C400 260 600 100 900 170 C1200 260 1400 100 1600 170;
        M0 180 C400 120 600 240 900 180 C1200 120 1400 240 1600 180
      "></animate>
  </path>

  <!-- Rotating rings -->
  <g transform="translate(800,140)">
    <circle r="70" fill="none" stroke="#7CFF9A" stroke-opacity="0.3" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"></animateTransform>
    </circle>

    <circle r="100" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="18s" repeatCount="indefinite"></animateTransform>
    </circle>
  </g>

  <!-- Floating particles -->
  <g fill="#7CFF9A">
    <circle cx="300" cy="200" r="3">
      <animate attributeName="cy" values="200;180;200" dur="3s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="1200" cy="90" r="2.5">
      <animate attributeName="cy" values="90;110;90" dur="4s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="700" cy="220" r="2">
      <animate attributeName="cy" values="220;200;220" dur="3.5s" repeatCount="indefinite"></animate>
    </circle>
  </g>

</svg>